<script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";

    const btn = document.getElementById('workBtn');
    
    btn.onclick = async () => {
        console.log("Butona basıldı!"); // Tarayıcı konsoluna yazar
        alert("İşlem başlıyor, lütfen bekleyin..."); // Ekranda uyarı çıkartır

        const urlVal = document.getElementById('url').value.trim();
        const startVal = document.getElementById('start').value;
        const endVal = document.getElementById('end').value;

        try {
            // BURAYI KENDİ SPACE ADRESİNLE DEĞİŞTİR:
            const app = await Client.connect("FasttReel/FastReel-Backend1");
            const prediction = await app.predict("/predict", [urlVal, startVal, endVal]);

            if (prediction.data) {
                document.getElementById('vid').src = prediction.data[0].url;
                alert("Video hazır!");
            }
        } catch (err) {
            console.error(err);
            alert("BAĞLANTI HATASI: " + err.message);
        }
    };
</script>
