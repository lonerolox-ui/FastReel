<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastReel - Kontrol Sende</title>
    <style>
        :root { --neon: #ff003c; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .panel { max-width: 400px; margin: auto; background: #111; padding: 30px; border-radius: 25px; border: 1px solid #222; box-shadow: 0 0 25px rgba(255, 0, 60, 0.2); }
        h1 { color: var(--neon); text-shadow: 0 0 10px var(--neon); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 2px solid #333; background: #000; color: white; box-sizing: border-box; }
        input:focus { border-color: var(--neon); outline: none; }
        .row { display: flex; gap: 10px; }
        .btn { background: var(--neon); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px var(--neon); margin-top: 10px; }
        #status { margin-top: 20px; color: #888; font-size: 14px; display: none; }
        #result { display: none; margin-top: 20px; }
        video { width: 100%; border-radius: 15px; border: 2px solid var(--neon); }
    </style>
</head>
<body>

    <div class="panel">
        <h1>FastReel V2</h1>
        <p>Kontrolü eline al, videonu yarat!</p>
        
        <input type="text" id="url" placeholder="YouTube Video Linki">
        
        <div class="row">
            <input type="number" id="start" placeholder="Başla (sn)" value="0">
            <input type="number" id="end" placeholder="Bitir (sn)" value="30">
        </div>

        <button id="workBtn" class="btn">VİDEOYU OLUŞTUR</button>

        <div id="status">🚀 Yapay Zeka videonu işliyor... <br> (Süreye göre 2-3 dakika sürebilir)</div>

        <div id="result">
            <video id="vid" controls></video>
            <p>✅ Video Hazır!</p>
        </div>
    </div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";

        const btn = document.getElementById('workBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');

        btn.onclick = async () => {
            const urlVal = document.getElementById('url').value;
            const startVal = document.getElementById('start').value;
            const endVal = document.getElementById('end').value;

            if(!urlVal) return alert("Linki unutma!");

            btn.disabled = true;
            status.style.display = "block";
            result.style.display = "none";

            try {
                // Burada 3 parametre gönderiyoruz: [url, start, end]
                const app = await Client.connect("FasttReel/FastReel-Backend");
                const prediction = await app.predict("/predict", [urlVal, startVal, endVal]);

                if (prediction.data) {
                    document.getElementById('vid').src = prediction.data[0].url;
                    status.style.display = "none";
                    result.style.display = "block";
                }
            } catch (err) {
                alert("Hata: " + err.message);
                status.style.display = "none";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
