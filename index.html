<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FastReel FIX</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 2px solid #ff003c; padding: 30px; border-radius: 20px; text-align: center; width: 300px; box-shadow: 0 0 20px #ff003c; }
        input { width: 100%; padding: 10px; margin: 20px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        button { background: #ff003c; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; }
        #status { margin-top: 15px; color: cyan; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>FastReel</h2>
        <input type="text" id="urlInput" placeholder="YouTube Linkini Yapıştır">
        <button id="goBtn">VİDEOYU YAP</button>
        <div id="status">Hazır.</div>
    </div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";

        const btn = document.getElementById('goBtn');
        const status = document.getElementById('status');

        btn.onclick = async () => {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return alert("Link gir!");

            btn.disabled = true;
            status.innerText = "Yapay Zekaya Bağlanıyor...";

            try {
                // Arka plandaki motorla bağlantı kuruyoruz
                const app = await Client.connect("FasttReel/FastReel-Backend");
                status.innerText = "Video İşleniyor (3-5 dk)...";
                
                const result = await app.predict("/predict", [url]);

                if(result.data) {
                    status.innerText = "BAŞARILI!";
                    window.open(result.data[0].url, '_blank');
                }
            } catch (err) {
                alert("HATA: " + err.message);
                status.innerText = "Hata oluştu.";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
