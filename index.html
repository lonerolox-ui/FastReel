<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastReel - YouTube to Shorts</title>
    <style>
        :root { --neon-red: #ff003c; --neon-white: #ffffff; --bg-black: #0a0a0a; }
        body { background-color: var(--bg-black); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        
        /* Logo Stili */
        .logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--neon-red); box-shadow: 0 0 15px var(--neon-red); margin-bottom: 10px; }

        .container { max-width: 450px; margin: auto; background: #111; padding: 30px; border-radius: 25px; border: 1px solid #222; box-shadow: 0 10px 40px rgba(255, 0, 60, 0.2); }
        
        h1 { color: var(--neon-red); font-size: 2.5rem; text-shadow: 0 0 10px var(--neon-red); margin: 10px 0; }
        p { color: #888; font-size: 0.9rem; margin-bottom: 25px; }

        input[type="text"] { width: 90%; padding: 15px; border-radius: 12px; border: 2px solid #333; background: #000; color: white; margin-bottom: 15px; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }

        .btn { background: var(--neon-red); color: white; padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; width: 95%; font-size: 1rem; box-shadow: 0 0 15px var(--neon-red); transition: 0.3s; }
        .btn:hover { transform: scale(1.02); opacity: 0.9; }

        /* Kırpma/Önizleme Alanı */
        #preview-area { display: none; margin-top: 30px; border-top: 1px solid #333; padding-top: 20px; }
        .shorts-frame { width: 200px; height: 350px; background: #000; margin: auto; border: 4px solid #222; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .loading-text { color: var(--neon-red); font-weight: bold; animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://raw.githubusercontent.com/lonerolox-ui/FastReel/main/logo.jpg" alt="FastReel Logo" class="logo" onerror="this.src='https://via.placeholder.com/80/ff003c/ffffff?text=FR'">
        
        <h1>FastReel</h1>
        <p>YouTube videosunu yapay zeka ile en iyi yerinden kırpıp Shorts yapın.</
