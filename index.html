<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastReel - Fix</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { border: 2px solid #ff003c; padding: 40px; border-radius: 20px; box-shadow: 0 0 20px #ff003c; width: 300px; }
        h1 { color: #ff003c; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: none; box-sizing: border-box; }
        #convertBtn { background: #ff003c; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #status { margin-top: 15px; color: cyan; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="card">
        <h1>FastReel</h1>
        <input type="text" id="videoUrl" placeholder="YouTube Linkini Yapıştır">
        <button id="convertBtn">DÖNÜŞTÜR</button>
        <div id="status"></div>
    </div>

    <script type="module">
        // Kütüphaneyi yüklemeyi dene
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";

        const btn = document.getElementById('convertBtn');
        const status = document.getElementById('status');

        // Buton tıklama olayı
        btn.onclick = async () => {
            const url = document.getElementById('videoUrl').value.trim();
            
            if(!url) {
                alert("Lütfen önce bir link yapıştır!");
                return;
            }

            console.log("Butona basıldı, işlem başlıyor...");
            status.innerText = "Bağlantı kuruluyor... Lütfen bekle.";
            btn.disabled = true;
            btn.style.opacity = "0.5";

            try {
                // Backend bağlantısı
                const client = await Client.connect("FasttReel/FastReel-Backend");
                status.innerText = "Video işleniyor... (3-5 dakika sürebilir)";
                
                const result = await client.predict("/predict", [url]);

                if (result.data) {
                    alert("BAŞARILI! Video hazır.");
                    status.innerText = "İşlem tamamlandı!";
                    window.open(result.data[0].url, '_blank');
                }
            } catch (error) {
                console.error(error);
                alert("HATA OLUŞTU: " + error.message);
                status.innerText = "Hata nedeniyle durdu.";
            } finally {
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        };
    </script>
</body>
</html>
