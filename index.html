<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastReel - YouTube to Shorts</title>
    <style>
        :root { --neon-red: #ff003c; --bg-black: #0a0a0a; }
        body { background-color: var(--bg-black); color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 400px; width: 90%; background: #111; padding: 40px 20px; border-radius: 30px; border: 1px solid #222; box-shadow: 0 0 30px rgba(255, 0, 60, 0.15); margin-top: 50px; }
        .logo-circle { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--neon-red); box-shadow: 0 0 20px var(--neon-red); margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; background: #000; font-weight: bold; }
        h1 { color: var(--neon-red); font-size: 2rem; text-shadow: 0 0 15px var(--neon-red); }
        input { width: 85%; padding: 15px; border-radius: 12px; border: 2px solid #333; background: #000; color: white; outline: none; margin-top: 20px; text-align: center; }
        .btn { background: var(--neon-red); color: white; padding: 15px 0; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; width: 90%; font-size: 1.1rem; margin-top: 20px; box-shadow: 0 0 20px var(--neon-red); }
        #loader { display: none; margin-top: 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #222; border-top: 4px solid var(--neon-red); border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #result { display: none; margin-top: 30px; width: 100%; }
        video { width: 100%; border-radius: 15px; border: 2px solid var(--neon-red); }
        .dl-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #fff; color: #000; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-circle">FR</div>
        <h1>FastReel</h1>
        <p style="color:#888;">YouTube linkini gir ve Shorts'a dönüştür!</p>
        
        <input type="text" id="videoUrl" placeholder="YouTube Linkini Yapıştır">
        <button class="btn" id="convertBtn">DÖNÜŞTÜR</button>

        <div id="loader">
            <div class="spinner"></div>
            <p style="color:var(--neon-red);">VİDEO İŞLENİYOR... LÜTFEN BEKLE.</p>
        </div>

        <div id="result">
            <h3 style="color:lawngreen;">VİDEON HAZIR! ✅</h3>
            <video id="outVid" controls></video>
            <br>
            <a id="dlBtn" class="dl-btn" href="#" target="_blank">VİDEOYU İNDİR</a>
        </div>
    </div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";

        const btn = document.getElementById('convertBtn');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');

        btn.onclick = async () => {
            const url = document.getElementById('videoUrl').value.trim();
            if(!url) return alert("Lütfen bir link gir!");

            btn.style.display = 'none';
            loader.style.display = 'block';
            result.style.display = 'none';
