<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastReel - YouTube to Shorts</title>
    <style>
        :root { --neon-red: #ff003c; --bg-black: #0a0a0a; --neon-white: #ffffff; }
        body { background-color: var(--bg-black); color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 400px; width: 90%; background: #111; padding: 40px 20px; border-radius: 30px; border: 1px solid #222; box-shadow: 0 0 30px rgba(255, 0, 60, 0.15); position: relative; }
        .logo-circle { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--neon-red); box-shadow: 0 0 20px var(--neon-red); margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; position: relative; }
        .fr-text { color:white; font-weight:bold; font-size: 1.5rem; }
        h1 { color: var(--neon-red); font-size: 2.5rem; text-shadow: 0 0 15px var(--neon-red); margin: 0; }
        p { color: #888; font-size: 0.9rem; margin-top: 10px; margin-bottom: 30px; }
        input[type="text"] { width: 85%; padding: 15px; border-radius: 12px; border: 2px solid #333; background: #000; color: white; outline: none; font-size: 1rem; transition: 0.3s; margin: 0 auto; display: block; }
        input[type="text"]:focus { border-color: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }
        .btn { background: var(--neon-red); color: white; padding: 15px 0; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; width: 93%; font-size: 1.1rem; margin-top: 20px; box-shadow: 0 0 20px var(--neon-red); transition: 0.3s; }
        .ai-loader-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 10, 0.95); border-radius: 30px; z-index: 10; flex-direction: column; align-items: center; justify-content: center; }
        .ai-loader { width: 100px; height: 100px; border-radius: 50%; border: 5px solid transparent; border-top-color: var(--neon-red); border-bottom-color: var(--neon-red); animation: ai-spin 1.5s linear infinite; }
        @keyframes ai-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-circle"><span class="fr-text">FR</span></div>
        <h1>FastReel</h1>
        <p>YouTube linkini dikey videoya dönüştür.</p>
        <input type="text" id="videoUrl" placeholder="Link yapıştır...">
        <button class="btn" onclick="donusturmeBaslat()">DÖNÜŞTÜR</button>
        <div class="ai-loader-container" id="loader">
            <div class="ai-loader"></div>
            <div id="statusText" style="color:var(--neon-red); margin-top:20px; font-weight:bold;">AI İŞLİYOR...</div>
        </div>
    </div>
    <script>
        async function donusturmeBaslat() {
            const url = document.getElementById('videoUrl').value;
            const loader = document.getElementById('loader');
            if(!url) return alert("Link gir!");
            loader.style.display = 'flex';
            try {
                await fetch("https://fasttreel-fastreel-backend.hf.space/call/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ data: [url] })
                });
                document.getElementById('statusText').innerText = "BAŞARILI! ✅";
                setTimeout(() => {
                    window.open("https://huggingface.co/spaces/FasttReel/FastReel-Backend", "_blank");
                    loader.style.display = 'none';
                }, 2000);
            } catch (e) {
                alert("Hata oluştu!");
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
