<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastReel - YouTube to Shorts</title>
    <style>
        :root { --neon-red: #ff003c; --bg-black: #0a0a0a; }
        body { background-color: var(--bg-black); color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        .container { max-width: 400px; width: 90%; background: #111; padding: 40px 20px; border-radius: 30px; border: 1px solid #222; box-shadow: 0 0 30px rgba(255, 0, 60, 0.15); }
        
        /* LOGO BURADA */
        .logo-circle { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--neon-red); box-shadow: 0 0 20px var(--neon-red); margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }

        h1 { color: var(--neon-red); font-size: 2.5rem; text-shadow: 0 0 15px var(--neon-red); margin: 0; }
        p { color: #888; font-size: 0.9rem; margin-top: 10px; margin-bottom: 30px; }

        /* LİNK YAPIŞTIRMA YERİ */
        .input-area { width: 100%; margin-bottom: 20px; }
        input[type="text"] { width: 85%; padding: 15px; border-radius: 12px; border: 2px solid #333; background: #000; color: white; outline: none; font-size: 1rem; transition: 0.3s; }
        input[type="text"]:focus { border-color: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }

        .btn { background: var(--neon-red); color: white; padding: 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; width: 93%; font-size: 1.1rem; box-shadow: 0 0 20px var(--neon-red); transition: 0.3s; margin-top: 10px; }
        .btn:hover { transform: scale(1.03); background: #d00030; }

        #status { display: none; margin-top: 20px; color: var(--neon-red); font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-circle">
            <img src="logo.jpg" alt="FastReel" onerror="this.style.display='none';">
            <span style="color:white; font-weight:bold;">FR</span> 
        </div>
        
        <h1>FastReel</h1>
        <p>YouTube videosunu en iyi yerinden kırpıp Shorts yapın.</p>
        
        <div class="input-area">
            <input type="text" id="urlInput" placeholder="YouTube linkini buraya yapıştır...">
        </div>
        
        <button class="btn" onclick="startAI()">AI İLE KIRP VE DÖNÜŞTÜR</button>

        <div id="status">Yapay Zeka analiz ediyor... %0</div>
    </div>

    <script>
        function startAI() {
            var val = document.getElementById('urlInput').value;
            if(val === "") { alert("Lütfen bir link yapıştırın!"); return; }
            
            var status = document.getElementById('status');
            status.style.display = "block";
            var count = 0;
            var interval = setInterval(function() {
                count += Math.floor(Math.random() * 15);
                if(count >= 100) {
                    status.innerText = "Videon Hazır! (Shorts formatına getirildi)";
                    clearInterval(interval);
                } else {
                    status.innerText = "Yapay Zeka analiz ediyor... %" + count;
                }
            }, 500);
        }
    </script>

</body>
</html>
