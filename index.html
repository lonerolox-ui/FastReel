<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastReel - YouTube to Shorts</title>
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; text-align: center; padding: 50px 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: #1a1a1a; padding: 40px 20px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ff0000; font-size: 3rem; margin-bottom: 5px; letter-spacing: -1px; }
        p { color: #888; margin-bottom: 30px; font-size: 0.9rem; }
        .input-group { margin-bottom: 20px; }
        input[type="text"] { width: 90%; padding: 15px; border-radius: 10px; border: 2px solid #333; background: #000; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: #ff0000; }
        .btn { background-color: #ff0000; color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1rem; width: 95%; transition: 0.3s; }
        .btn:hover { background-color: #cc0000; transform: scale(1.02); }
        .footer-text { margin-top: 30px; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FastReel</h1>
        <p>YouTube videolarını yapay zeka ile Shorts ve Reels formatına dönüştürün.</p>
        
        <div class="input-group">
            <input type="text" placeholder="YouTube video bağlantısını buraya yapıştırın...">
        </div>
        
        <button class="btn" onclick="alert('Dönüştürme işlemi yakında aktif olacak!')">Hemen Dönüştür</button>

        <div class="footer-text">
            ⚡ Ücretsiz, hızlı ve sınırsız.
        </div>
    </div>
</body>
</html>
