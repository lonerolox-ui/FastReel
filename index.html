<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastReel</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 50px 20px; }
        .box { border: 2px solid #ff003c; padding: 30px; border-radius: 20px; display: inline-block; box-shadow: 0 0 20px #ff003c; }
        h1 { color: #ff003c; }
        input { padding: 12px; width: 80%; border-radius: 10px; border: none; margin-top: 20px; }
        button { background: #ff003c; color: white; border: none; padding: 15px 30px; border-radius: 10px; margin-top: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>FastReel</h1>
        <p>YouTube Linkini Yapıştır</p>
        <input type="text" id="url" placeholder="https://youtube.com...">
        <br>
        <button id="btn">VİDEOYU DÖNÜŞTÜR</button>
        <p id="msg" style="display:none; color:cyan;">İşlem başladı, lütfen bekle...</p>
    </div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";
        document.getElementById('btn').onclick = async () => {
            const val = document.getElementById('url').value;
            if(!val) return alert("Link boş!");
            document.getElementById('msg').style.display = 'block';
            try {
                const app = await Client.connect("FasttReel/FastReel-Backend");
                const res = await app.predict("/predict", [val]);
                alert("Başarılı! Video hazır.");
                console.log(res);
            } catch (e) {
                alert("Hata: " + e.message);
                document.getElementById('msg').style.display = 'none';
            }
        };
    </script>
</body>
</html>
