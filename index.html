<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastReel - YouTube to Shorts</title>
    <style>
        :root { --neon-red: #ff003c; --bg-black: #0a0a0a; --neon-white: #ffffff; }
        body { background-color: var(--bg-black); color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 400px; width: 90%; background: #111; padding: 40px 20px; border-radius: 30px; border: 1px solid #222; box-shadow: 0 0 30px rgba(255, 0, 60, 0.15); position: relative; }
        .logo-circle { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--neon-red); box-shadow: 0 0 20px var(--neon-red); margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
        .fr-text { color:white; font-weight:bold; font-size: 1.5rem; }
        h1 { color: var(--neon-red); font-size: 2.5rem; text-shadow: 0 0 15px var(--neon-red); margin: 0; }
        p { color: #888; font-size: 0.9rem; margin-top: 10px; margin-bottom: 30px; }
        input[type="text"] { width: 85%; padding: 15px; border-radius: 12px; border: 2px solid #333; background: #000; color: white; outline: none; font-size: 1rem; transition: 0.3s; margin: 0 auto 20px auto; display: block; }
        .btn { background: var(--neon-red); color: white; padding: 15px 0; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; width: 93%; font-size: 1.1rem; box-shadow: 0 0 20px var(--neon-red); transition: 0.3s; }
        .btn:disabled { background: #444; box-shadow: none; cursor: not-allowed; }

        /* YÜKLEME EKRANI (AI SİMGESİ) */
        .ai-loader-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 10, 0.95); border-radius: 30px; z-index: 10; flex-direction: column; align-items: center; justify-content: center; }
        .ai-loader { width: 100px; height: 100px; border-radius: 50%; border: 5px solid transparent; border-top-color: var(--neon-red); border-bottom-color: var(--neon-red); animation: ai-spin 1.5s linear infinite; box-shadow: 0 0 30px var(--neon-red); }
        @keyframes ai-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ai-text { color: var(--neon-red); margin-top: 20px; font-weight: bold; text-shadow: 0 0 10px var(--neon-red); }

        /* SONUÇ ALANI */
        #result-area { display: none; margin-top: 30px; width: 100%; }
        video { width: 100%; max-width: 200px; border-radius: 15px; border: 3px solid var(--neon-red); box-shadow: 0 0 15px var(--neon-red); }
        .download-btn { display: inline-block; background: none; border: 2px solid var(--neon-white); color: var(--neon-white); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-circle"><span class="fr-text">FR</span></div>
        <h1>FastReel</h1>
        <p>YouTube linkini gir ve Shorts'a dönüştür!</p>
        
        <input type="text" id="urlInput" placeholder="YouTube linkini yapıştırın...">
        <button class="btn" id="startBtn">AI İLE DÖNÜŞTÜR</button>

        <div class="ai-loader-container" id="aiLoader">
            <div class="ai-loader"></div>
            <div class="ai-text" id="aiStatus">Yapay Zeka Analiz Ediyor...</div>
        </div>

        <div id="result-area">
            <h3 style="color:var(--neon-white);">Videon Hazır! ✅</h3>
            <video id="outVid" controls></video>
            <br>
            <a id="dlLink" class="download-btn" href="#" target="_blank">VİDEOYU İNDİR</a>
        </div>
    </div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js";

        const btn = document.getElementById('startBtn');
        const urlInput = document.getElementById('urlInput');
        const loader = document.getElementById('aiLoader');
        const resultArea = document.getElementById('result-area');
        const statusText = document.getElementById('aiStatus');
        const outVid = document.getElementById('outVid');
        const dlLink = document.getElementById('dlLink');

        btn.onclick = async () => {
            const url = urlInput.value.trim();
            if(!url) return alert("Lütfen bir link gir!");

            loader.style.display = "flex";
            resultArea.style.display = "none";
            btn.disabled = true;

            try {
                // Hugging Face motoruna bağlanıyoruz
                statusText.innerText = "Yapay Zeka Hazırlanıyor...";
                const client = await Client.connect("FasttReel/FastReel-Backend");
                
                statusText.innerText = "Video İşleniyor... (3-5 Dakika Sürebilir)";
                const res = await client.predict("/predict", [url]);

                if (res.data && res.data[0]) {
                    const videoUrl = res.data[0].url;
                    outVid.src = videoUrl;
                    dlLink.href = videoUrl;
                    
                    loader.style.display = "none";
                    resultArea.style.display = "block";
                }
            } catch (e) {
                alert("Bağlantı Hatası: " + e.message + "\nLütfen motorun 'Running' olduğundan emin ol!");
                loader.style.display = "none";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
